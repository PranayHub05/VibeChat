<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VibeChat — Real-time Rooms</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== LANDING SCREEN ===== -->
  <div id="landing-screen" class="screen active">
    <div class="landing-container">
      <!-- Logo / Title -->
      <div class="brand">
        <svg class="brand-icon" width="40" height="40" viewBox="0 0 24 24" fill="none">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6A8.38 8.38 0 0 1 12.5 3h.5a8.48 8.48 0 0 1 8 8v.5Z"
                stroke="url(#iconGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <defs><linearGradient id="iconGrad" x1="3" y1="3" x2="21" y2="21"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs>
        </svg>
        <h1 class="brand-title">VibeChat</h1>
      </div>
      <p class="tagline">Real-time rooms. Zero friction.</p>

      <!-- Username -->
      <div class="input-group username-group">
        <label for="username-input" class="sr-only">Username</label>
        <input type="text" id="username-input" class="input" placeholder="Choose a username" maxlength="24" autocomplete="off" required />
        <span class="input-error" id="username-error"></span>
      </div>

      <!-- Action Cards -->
      <div class="action-cards">
        <!-- Create Room Card -->
        <div class="card">
          <div class="card-icon">
            <!-- Plus icon -->
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
              <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
          <h2 class="card-title">Create Room</h2>
          <p class="card-desc">Start a new conversation</p>
          <button id="create-btn" class="btn btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            Create
          </button>
        </div>

        <!-- Join Room Card -->
        <div class="card">
          <div class="card-icon">
            <!-- Door-open icon -->
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
              <path d="M13 4h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M11 16l4-4-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M15 12H3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
          <h2 class="card-title">Join Room</h2>
          <p class="card-desc">Enter a room code</p>
          <div class="input-group room-code-group">
            <input type="text" id="room-code-input" class="input input-code" placeholder="ABCDEF" maxlength="6" autocomplete="off" />
            <span class="input-error" id="room-code-error"></span>
          </div>
          <button id="join-btn" class="btn btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M10 17l5-5-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M15 12H3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            Join
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== CHAT SCREEN ===== -->
  <div id="chat-screen" class="screen">

    <!-- Header -->
    <header class="chat-header">
      <div class="header-left">
        <div class="room-info">
          <span class="room-label">Room</span>
          <code class="room-code" id="room-code-display">------</code>
          <button id="copy-code-btn" class="btn-icon" title="Copy room code">
            <!-- Copy icon -->
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <rect x="9" y="9" width="13" height="13" rx="2" stroke="currentColor" stroke-width="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="header-right">
        <!-- Mobile sidebar toggle -->
        <button id="sidebar-toggle" class="btn-icon sidebar-toggle" title="Online users">
          <!-- Users icon -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="9" cy="7" r="4" stroke="currentColor" stroke-width="2"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span class="user-count-badge" id="user-count-badge">0</span>
        </button>
        <button id="leave-btn" class="btn btn-ghost" title="Leave room">
          <!-- Log-out icon -->
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <polyline points="16,17 21,12 16,7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="21" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span class="btn-label">Leave</span>
        </button>
      </div>
    </header>

    <!-- Main chat area -->
    <main class="chat-main">
      <!-- Messages column -->
      <section class="chat-column">
        <div class="messages" id="messages">
          <!-- Messages are injected here -->
        </div>
        <div class="message-input-bar">
          <input type="text" id="message-input" class="input message-input" placeholder="Type a message…" autocomplete="off" maxlength="2000" />
          <button id="send-btn" class="btn-send" title="Send message" disabled>
            <!-- Send icon -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M22 2 11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M22 2 15 22 11 13 2 9l20-7Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </section>

      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <h3 class="sidebar-title">
            <span class="presence-dot"></span>
            Online
            <span class="online-count" id="online-count">0</span>
          </h3>
        </div>
        <div class="user-list" id="user-list">
          <!-- Users injected here -->
        </div>
      </aside>

      <!-- Sidebar overlay for mobile -->
      <div class="sidebar-overlay" id="sidebar-overlay"></div>
    </main>

    <!-- Copy toast -->
    <div class="toast" id="copy-toast">Copied!</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
